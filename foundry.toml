[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 32
fail_on_revert = true
